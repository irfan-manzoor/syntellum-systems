version: '3.8'

services:
  syntellum-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syntellum-production
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
